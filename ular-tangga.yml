name: Ular Tangga

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ular-tangga
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ular-tangga')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lempar dadu
        env:
          PLAYER: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: python game/play.py

      - name: Simpan perubahan
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🎲 $PLAYER melempar dadu"
          git pull --rebase
          git push

      - name: Balas dan tutup issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file /tmp/msg.md
          gh issue close "$NUMBER"
